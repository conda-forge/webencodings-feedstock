schema_version: 1

context:
  version: 0.6.1

package:
  name: webencodings
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/w/webencodings/webencodings-${{ version }}.tar.gz
  sha256: 565f9ad031c702dae404e27a099e3e09186a3ab1b9520f06d215502b651fd910

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - flit-core >=3.2,<5
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - webencodings
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Character encoding aliases for legacy web content
  homepage: https://github.com/gsnedders/python-webencodings
  repository: https://github.com/gsnedders/python-webencodings
  documentation: https://pythonhosted.org/webencodings

extra:
  recipe-maintainers:
    - jschueller
    - ocefpaf
